# Render Blueprint: New > Blueprint > pick this repo. Free plan notes: the service sleeps after ~15 min idle (cold start ~1 min),
# has an ephemeral disk (images live in R2/B2, data in Neon) and gives no shell. Run `npm run seed:admin` from your own computer.
services:
  - type: web
    name: talha-studio-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: TRUST_PROXY_HOPS, value: "1" }
      - { key: STORAGE_DRIVER, value: s3 }
      - { key: EMAIL_DRIVER, value: none }
      - { key: STORE_TIMEZONE, value: Asia/Karachi }
      - { key: DATABASE_URL, sync: false }          # Neon connection string (sslmode=require)
      - { key: JWT_ACCESS_SECRET, generateValue: true }
      - { key: ADMIN_ORIGIN, sync: false }          # https://admin.yourdomain.com,https://appassets.androidplatform.net
      - { key: GOOGLE_WEB_CLIENT_ID, sync: false }
      - { key: S3_ENDPOINT, sync: false }
      - { key: S3_BUCKET, sync: false }
      - { key: S3_ACCESS_KEY_ID, sync: false }
      - { key: S3_SECRET_ACCESS_KEY, sync: false }
      - { key: PUBLIC_MEDIA_BASE_URL, sync: false }
      - { key: RESEND_API_KEY, sync: false }
      - { key: RESEND_WEBHOOK_SECRET, sync: false }
      - { key: EMAIL_FROM, sync: false }
      - { key: BREVO_API_KEY, sync: false }
      - { key: CRON_SECRET, generateValue: true }
      - { key: ADMIN_PUBLIC_URL, sync: false }
      - { key: FCM_SERVICE_ACCOUNT_JSON, sync: false }
