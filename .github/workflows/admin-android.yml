name: Admin Android app
on:
  push: { branches: [main], paths: ["admin/**", "admin-android/**", ".github/workflows/admin-android.yml"] }
  pull_request: { paths: ["admin/**", "admin-android/**"] }
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ADMIN_API_BASE: ${{ vars.ADMIN_API_BASE }}          # Settings > Secrets and variables > Actions > Variables (HTTPS URL ending in /v1)
    defaults: { run: { working-directory: admin-android } }
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check admin web modules
        working-directory: .
        run: for f in admin/js/*.js admin/js/views/*.js; do node --check "$f"; done
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Firebase config (optional, enables new-order push)
        env: { GSJ: "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" }
        run: |
          if [ -z "$GSJ" ]; then
            echo "::warning title=ORDER PUSH OFF::Secret GOOGLE_SERVICES_JSON_BASE64 is empty or missing. The admin app still works; it just cannot receive push alerts."
            exit 0
          fi
          # The secret may be the base64 text OR the plain contents of google-services.json.
          if printf '%s' "$GSJ" | base64 -d > app/google-services.json 2>/dev/null && python3 -c 'import json;json.load(open("app/google-services.json"))' 2>/dev/null; then :
          else printf '%s' "$GSJ" > app/google-services.json; fi
          python3 - <<'PY'
          import json, os
          try:
              j = json.load(open("app/google-services.json"))
              pk = [c["client_info"]["android_client_info"]["package_name"] for c in j.get("client", [])]
          except Exception as e:
              os.remove("app/google-services.json")
              print("::warning title=ORDER PUSH OFF::google-services.json is not complete (" + str(e) + ").")
              raise SystemExit(0)
          print("packages:", pk)
          missing = [n for n in ("com.talhastudio.admin", "com.talhastudio.admin.debug") if n not in pk]
          if missing:
              os.remove("app/google-services.json")      # a file without one of the packages would break the build
              print("::warning title=ORDER PUSH OFF::google-services.json has no Firebase app for " + ", ".join(missing) + ". Add those Android apps in Firebase, download the file again and update the secret.")
          PY
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: talha-admin-debug-apk, path: admin-android/app/build/outputs/apk/debug/*.apk }
      - id: ks
        env: { K: "${{ secrets.TS_KEYSTORE_BASE64 }}" }
        run: |
          if [ -n "$K" ]; then echo "has=true" >> "$GITHUB_OUTPUT"; else echo "has=false" >> "$GITHUB_OUTPUT"; fi
      - name: Build signed release APK (only if signing secrets exist)
        if: ${{ steps.ks.outputs.has == 'true' }}
        env:
          KEYSTORE_B64: ${{ secrets.TS_KEYSTORE_BASE64 }}
          TS_KEYSTORE_PASSWORD: ${{ secrets.TS_KEYSTORE_PASSWORD }}
          TS_ADMIN_KEY_ALIAS: ${{ secrets.TS_ADMIN_KEY_ALIAS || secrets.TS_KEY_ALIAS }}
          TS_KEY_PASSWORD: ${{ secrets.TS_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          TS_KEYSTORE_PATH="$RUNNER_TEMP/release.jks" gradle :app:assembleRelease
      - uses: actions/upload-artifact@v4
        if: ${{ steps.ks.outputs.has == 'true' }}
        with: { name: talha-admin-release-apk, path: admin-android/app/build/outputs/apk/release/*.apk }
