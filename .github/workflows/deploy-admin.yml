name: Deploy admin site
on:
  push: { branches: [main], paths: ["admin/**", ".github/workflows/deploy-admin.yml"] }
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      API_BASE: ${{ vars.ADMIN_API_BASE }}                # Variables: https://your-api-host/v1
    steps:
      - uses: actions/checkout@v4
      - name: Point the admin site at your API
        run: |
          if [ -z "$API_BASE" ]; then echo "ADMIN_API_BASE variable is not set; the site would keep the localhost default" && exit 1; fi
          case "$API_BASE" in https://*) ;; *) echo "ADMIN_API_BASE must start with https://" && exit 1 ;; esac
          sed -i "s|^export const API_BASE = .*|export const API_BASE = \"$API_BASE\";|" admin/js/config.js
          grep -n "API_BASE" admin/js/config.js
      - run: for f in admin/js/*.js admin/js/views/*.js admin/sw.js; do node --check "$f"; done
      - id: ks
        env: { K: "${{ secrets.CLOUDFLARE_API_TOKEN }}" }
        run: |
          if [ -n "$K" ]; then echo "has=true" >> "$GITHUB_OUTPUT"; else echo "has=false" >> "$GITHUB_OUTPUT"; fi
      - name: Deploy to Cloudflare Pages (only when credentials exist)
        if: ${{ steps.ks.outputs.has == 'true' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy admin --project-name=${{ vars.CF_PAGES_PROJECT }} --branch=main
      - uses: actions/upload-artifact@v4
        with: { name: talha-admin-site, path: admin }
